[package]
name = "spatie-schema-org"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Freek Van der Herten <freek@spatie.be>"]
description = "Fluent Schema.org builders and JSON-LD for Rust"
license = "MIT"
repository = "https://github.com/spatie/schema-org-rust"
documentation = "https://docs.rs/spatie-schema-org"
readme = "README.md"
keywords = ["spatie", "schema-org", "json-ld", "structured-data", "seo"]
categories = ["web-programming", "encoding"]
include = ["/src/", "/tests/*.rs", "/generator/", "/build.rs", "/docs/", "/README.md", "/LICENSE.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/Cargo.lock"]

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
time = { version = "0.3", features = ["parsing"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[profile.release]
lto = "thin"
strip = true
